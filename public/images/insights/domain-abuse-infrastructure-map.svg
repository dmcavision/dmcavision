<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Domain abuse infrastructure map</title><desc id="desc">A deceptive domain connects to DNS, registrar, hosting, email, and coordinated response channels.</desc>
  <defs><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#173047"/></pattern></defs><rect width="1200" height="675" fill="#07111f"/><rect width="1200" height="675" fill="url(#grid)" opacity=".6"/>
  <text x="75" y="80" fill="#72deb8" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">DOMAIN RISK OPERATIONS</text><text x="75" y="126" fill="#f4f8fa" font-family="Arial,sans-serif" font-size="32" font-weight="700">Infrastructure-to-response map</text>
  <g stroke="#2a8d6e" stroke-width="2" stroke-dasharray="7 8"><path d="M600 345 250 220M600 345 250 475M600 345 600 175M600 345 950 220M600 345 950 475"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(600 345)"><circle r="112" fill="#12352f" stroke="#31d69d" stroke-width="2"/><circle r="55" fill="none" stroke="#75e3bb" stroke-width="3"/><path d="M545 345h110M600 290c24 26 24 84 0 110M600 290c-24 26-24 84 0 110" fill="none" stroke="#75e3bb" stroke-width="3"/><text y="144" fill="#dce5eb" font-size="15">Deceptive domain</text></g><g transform="translate(250 220)"><rect x="-95" y="-45" width="190" height="90" rx="15" fill="#10243a" stroke="#38566a"/><text y="-3" fill="#75e3bb" font-size="13">DNS</text><text y="20" fill="#dce5eb" font-size="15">Resolution layer</text></g><g transform="translate(250 475)"><rect x="-95" y="-45" width="190" height="90" rx="15" fill="#10243a" stroke="#38566a"/><text y="-3" fill="#75e3bb" font-size="13">REGISTRAR</text><text y="20" fill="#dce5eb" font-size="15">Registration control</text></g><g transform="translate(600 175)"><rect x="-95" y="-45" width="190" height="90" rx="15" fill="#10243a" stroke="#38566a"/><text y="-3" fill="#75e3bb" font-size="13">EMAIL</text><text y="20" fill="#dce5eb" font-size="15">Impersonation path</text></g><g transform="translate(950 220)"><rect x="-95" y="-45" width="190" height="90" rx="15" fill="#10243a" stroke="#38566a"/><text y="-3" fill="#75e3bb" font-size="13">HOSTING</text><text y="20" fill="#dce5eb" font-size="15">Content control</text></g><g transform="translate(950 475)"><rect x="-95" y="-45" width="190" height="90" rx="15" fill="#13392f" stroke="#31d69d"/><text y="-3" fill="#84e9c4" font-size="13">RESPONSE</text><text y="20" fill="#eef6f4" font-size="15">Coordinated action</text></g></g>
</svg>
