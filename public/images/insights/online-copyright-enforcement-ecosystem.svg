<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Digital copyright protection ecosystem</title>
  <desc id="desc">Creator asset moving through detection, evidence, platform reporting, and resolution.</desc>
  <defs><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#173047" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#16c784"/></marker></defs>
  <rect width="1200" height="675" fill="#07111f"/><rect width="1200" height="675" fill="url(#grid)" opacity=".7"/>
  <text x="76" y="82" fill="#72deb8" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">COPYRIGHT OPERATIONS</text>
  <text x="76" y="127" fill="#f5f8fa" font-family="Arial,sans-serif" font-size="32" font-weight="700">Protection ecosystem</text>
  <path d="M182 348H1015" stroke="#16c784" stroke-width="3" stroke-dasharray="8 10" marker-end="url(#arrow)"/>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(150 348)"><rect x="-78" y="-84" width="156" height="168" rx="18" fill="#10243a" stroke="#2f5363"/><path d="M-24-28h48v57h-48zM-14-39h28" fill="none" stroke="#75e3bb" stroke-width="3"/><text y="61" fill="#e6eef3" font-size="14">Creator asset</text></g><g transform="translate(370 348)"><circle r="72" fill="#10243a" stroke="#2f5363"/><circle r="32" fill="none" stroke="#75e3bb" stroke-width="3"/><path d="M23 23 48 48" stroke="#75e3bb" stroke-width="5"/><text y="105" fill="#e6eef3" font-size="14">Detection</text></g><g transform="translate(590 348)"><rect x="-72" y="-72" width="144" height="144" rx="18" fill="#10243a" stroke="#2f5363"/><path d="M-35-25h70M-35 0h54M-35 25h62" stroke="#75e3bb" stroke-width="4"/><text y="105" fill="#e6eef3" font-size="14">Evidence</text></g><g transform="translate(810 348)"><rect x="-75" y="-64" width="150" height="128" rx="18" fill="#10243a" stroke="#2f5363"/><path d="m-43-20 43 28 43-28M0 8v40" fill="none" stroke="#75e3bb" stroke-width="4"/><text y="98" fill="#e6eef3" font-size="14">Platform report</text></g><g transform="translate(1030 348)"><circle r="72" fill="#12382f" stroke="#31d69d"/><path d="m-32 1 20 21 44-48" fill="none" stroke="#89efca" stroke-width="7"/><text y="105" fill="#e6eef3" font-size="14">Resolution</text></g></g>
  <text x="76" y="610" fill="#7f93a3" font-family="Arial,sans-serif" font-size="15">Evidence-led review keeps every decision connected to its source and outcome.</text>
