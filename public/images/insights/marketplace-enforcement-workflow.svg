  <text x="74" y="80" fill="#72deb8" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">MARKETPLACE ENFORCEMENT</text><text x="74" y="125" fill="#f4f8fa" font-family="Arial,sans-serif" font-size="32" font-weight="700">From listing signal to verified outcome</text>
