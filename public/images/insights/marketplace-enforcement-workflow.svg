<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Marketplace enforcement workflow</title><desc id="desc">Listing discovery proceeds through seller analysis, evidence review, a platform report, and verified resolution.</desc>
