<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Complete IP enforcement lifecycle</title><desc id="desc">Detection proceeds through review, evidence, submission, resolution, and reporting in a connected lifecycle.</desc>
