  <text x="74" y="80" fill="#72deb8" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">RIGHTS OPERATIONS</text><text x="74" y="126" fill="#f4f8fa" font-family="Arial,sans-serif" font-size="32" font-weight="700">Complete enforcement lifecycle</text>
  <path d="M124 345H1080" stroke="#16c784" stroke-width="3" stroke-dasharray="8 9" marker-end="url(#a)"/>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(120 345)"><circle r="57" fill="#10243a" stroke="#365366"/><circle r="24" fill="none" stroke="#75e3bb" stroke-width="3"/><path d="m17 17 24 24" stroke="#75e3bb" stroke-width="4"/><text y="91" fill="#dce5eb" font-size="13">Detection</text></g><g transform="translate(312 345)"><circle r="57" fill="#10243a" stroke="#365366"/><path d="M-24-19h48M-24 0h38M-24 19h44" stroke="#75e3bb" stroke-width="3"/><text y="91" fill="#dce5eb" font-size="13">Review</text></g><g transform="translate(504 345)"><circle r="57" fill="#10243a" stroke="#365366"/><path d="M-22-30h44v60h-44zM-12-40h24" fill="none" stroke="#75e3bb" stroke-width="3"/><text y="91" fill="#dce5eb" font-size="13">Evidence</text></g><g transform="translate(696 345)"><circle r="57" fill="#10243a" stroke="#365366"/><path d="m-30-12 30 20 30-20M0 8v30" fill="none" stroke="#75e3bb" stroke-width="3"/><text y="91" fill="#dce5eb" font-size="13">Submission</text></g><g transform="translate(888 345)"><circle r="57" fill="#12372f" stroke="#31d69d"/><path d="m-25 0 16 17 34-39" fill="none" stroke="#8aefcb" stroke-width="6"/><text y="91" fill="#dce5eb" font-size="13">Resolution</text></g><g transform="translate(1080 345)"><circle r="57" fill="#10243a" stroke="#365366"/><path d="M-28 25v-18M0 25v-43M28 25v-30" stroke="#75e3bb" stroke-width="6"/><text y="91" fill="#dce5eb" font-size="13">Reporting</text></g></g>
