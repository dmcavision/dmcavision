<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">IP threat intelligence graph</title><desc id="desc">Accounts, domains, protected assets, relationships, and risk signals form a traceable intelligence graph.</desc>
  <defs><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#173047"/></pattern></defs><rect width="1200" height="675" fill="#07111f"/><rect width="1200" height="675" fill="url(#grid)" opacity=".55"/>
  <text x="75" y="80" fill="#72deb8" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">IP THREAT INTELLIGENCE</text><text x="75" y="126" fill="#f4f8fa" font-family="Arial,sans-serif" font-size="32" font-weight="700">Evidence-backed relationship graph</text>
  <g stroke="#2b725d" stroke-width="2"><path d="M580 350 260 220M580 350 270 495M580 350 580 175M580 350 920 205M580 350 950 475M260 220 580 175M920 205 950 475M270 495 950 475"/><path d="M260 220 950 475" stroke-dasharray="5 8" opacity=".5"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(580 350)"><circle r="112" fill="#12352f" stroke="#31d69d" stroke-width="2"/><text y="-10" fill="#78e3bd" font-size="13">ANALYTICAL CORE</text><text y="22" fill="#f1f6f8" font-size="23" font-weight="700">RELATIONSHIPS</text></g><g transform="translate(260 220)"><circle r="70" fill="#10243a" stroke="#365366"/><text y="-5" fill="#75e3bb" font-size="13">ACCOUNTS</text><text y="20" fill="#dce5eb" font-size="15">Observed entities</text></g><g transform="translate(270 495)"><circle r="70" fill="#10243a" stroke="#365366"/><text y="-5" fill="#75e3bb" font-size="13">DOMAINS</text><text y="20" fill="#dce5eb" font-size="15">Infrastructure</text></g><g transform="translate(580 175)"><circle r="70" fill="#10243a" stroke="#365366"/><text y="-5" fill="#75e3bb" font-size="13">ASSETS</text><text y="20" fill="#dce5eb" font-size="15">Protected works</text></g><g transform="translate(920 205)"><circle r="70" fill="#10243a" stroke="#365366"/><text y="-5" fill="#75e3bb" font-size="13">SIGNALS</text><text y="20" fill="#dce5eb" font-size="15">Source + time</text></g><g transform="translate(950 475)"><circle r="70" fill="#13392f" stroke="#31d69d"/><text y="-5" fill="#85e9c5" font-size="13">RISK</text><text y="20" fill="#eef6f4" font-size="15">Priority decision</text></g></g>
</svg>
