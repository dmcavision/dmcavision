<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Online counterfeit network map</title><desc id="desc">Seller accounts connect to marketplace listings, domains, reused assets, and payment channels.</desc>
  <defs><pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0V46" fill="none" stroke="#173047"/></pattern></defs><rect width="1200" height="675" fill="#07111f"/><rect width="1200" height="675" fill="url(#grid)" opacity=".55"/>
  <text x="75" y="80" fill="#72deb8" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">COUNTERFEIT INTELLIGENCE</text><text x="75" y="126" fill="#f4f8fa" font-family="Arial,sans-serif" font-size="32" font-weight="700">Connected commercial network</text>
  <g stroke="#28785f" stroke-width="2" stroke-dasharray="6 7" opacity=".85"><path d="M590 335 260 230M590 335 242 457M590 335 600 175M590 335 917 221M590 335 954 452M260 230 600 175M242 457 954 452M917 221 954 452"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(590 335)"><circle r="104" fill="#12352f" stroke="#31d69d" stroke-width="2"/><text y="-8" fill="#7ce6bf" font-size="12">NETWORK</text><text y="22" fill="#f1f6f8" font-size="22" font-weight="700">RISK SIGNALS</text></g><g transform="translate(260 230)"><rect x="-100" y="-48" width="200" height="96" rx="16" fill="#10243a" stroke="#365165"/><text y="-6" fill="#78e2bb" font-size="13">SELLER ACCOUNTS</text><text y="20" fill="#dfe7ec" font-size="16">12 linked profiles</text></g><g transform="translate(242 457)"><rect x="-100" y="-48" width="200" height="96" rx="16" fill="#10243a" stroke="#365165"/><text y="-6" fill="#78e2bb" font-size="13">MARKETPLACES</text><text y="20" fill="#dfe7ec" font-size="16">38 listings</text></g><g transform="translate(600 175)"><rect x="-100" y="-48" width="200" height="96" rx="16" fill="#10243a" stroke="#365165"/><text y="-6" fill="#78e2bb" font-size="13">REUSED ASSETS</text><text y="20" fill="#dfe7ec" font-size="16">Images + copy</text></g><g transform="translate(917 221)"><rect x="-100" y="-48" width="200" height="96" rx="16" fill="#10243a" stroke="#365165"/><text y="-6" fill="#78e2bb" font-size="13">DOMAINS</text><text y="20" fill="#dfe7ec" font-size="16">Redirect paths</text></g><g transform="translate(954 452)"><rect x="-100" y="-48" width="200" height="96" rx="16" fill="#10243a" stroke="#365165"/><text y="-6" fill="#78e2bb" font-size="13">PAYMENT</text><text y="20" fill="#dfe7ec" font-size="16">Commercial routes</text></g></g>
