<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AI brand monitoring with human validation</title><desc id="desc">AI detection and confidence scoring route a candidate to human review before an enforcement decision.</desc>
  <defs><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#173047"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#16c784"/></marker></defs><rect width="1200" height="675" fill="#07111f"/><rect width="1200" height="675" fill="url(#grid)" opacity=".6"/>
  <text x="75" y="82" fill="#72deb8" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">AI + HUMAN GOVERNANCE</text><text x="75" y="127" fill="#f4f8fa" font-family="Arial,sans-serif" font-size="32" font-weight="700">Accountable monitoring workflow</text>
  <path d="M230 351H955" stroke="#16c784" stroke-width="3" stroke-dasharray="8 9" marker-end="url(#arrow)"/>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(180 350)"><circle r="82" fill="#10243a" stroke="#2e5061"/><path d="M-30-12h60M-30 12h60M-12-30v60M12-30v60" stroke="#75e3bb" stroke-width="3"/><text y="117" fill="#dce5eb" font-size="15">AI detection</text></g><g transform="translate(460 350)"><rect x="-95" y="-70" width="190" height="140" rx="18" fill="#10243a" stroke="#2e5061"/><text y="-20" fill="#7790a0" font-size="12">CONFIDENCE</text><text y="24" fill="#77e5be" font-size="36" font-weight="700">87%</text><text y="117" fill="#dce5eb" font-size="15">Risk scoring</text></g><g transform="translate(740 350)"><circle r="82" fill="#12332e" stroke="#31d69d" stroke-width="2"/><circle cy="-20" r="22" fill="none" stroke="#8aefcb" stroke-width="4"/><path d="M-38 43c5-38 71-38 76 0" fill="none" stroke="#8aefcb" stroke-width="4"/><text y="117" fill="#dce5eb" font-size="15">Human review</text></g><g transform="translate(1020 350)"><rect x="-90" y="-70" width="180" height="140" rx="18" fill="#133a30" stroke="#31d69d"/><path d="m-30 0 20 21 42-48" fill="none" stroke="#8aefcb" stroke-width="6"/><text y="117" fill="#dce5eb" font-size="15">Decision</text></g></g>
  <text x="75" y="610" fill="#8193a2" font-family="Arial,sans-serif" font-size="15">Automated signals inform the review; they do not replace accountable judgment.</text>
</svg>
